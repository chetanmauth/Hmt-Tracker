name: HMT Stock Check

on:
  schedule:
    # Runs at minute 0 of every hour (UTC).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-stock:
    runs-on: ubuntu-latest
    
    # We need write permissions so the bot can commit the json file back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hmt_stock_check.py

      - name: Commit and push state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previous_stock.json
          
          # This line checks if the json file actually changed. If yes, it commits and pushes.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock state" && git push)
